<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar + single-column app views; bottom tab bar on phones. Wax-print motifs only on project covers. */
:root{
  --bg:#F4F6F1; --surface:#FFFFFF; --ink:#12261D; --muted:#53645A; --line:#DCE2D9;
  --brand:#0F4A38; --on-brand:#FFFFFF; --gold:#E9A820; --hib:#B8325A; --ok:#1E7B52; --soft:#E7EEE6;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1612; --surface:#15221B; --ink:#E9F0EA; --muted:#9BAEA2; --line:#26372D;
  --brand:#38B98A; --on-brand:#04130C; --gold:#F0B73A; --hib:#E0678A; --ok:#4CC28D; --soft:#1B2C23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1612; --surface:#15221B; --ink:#E9F0EA; --muted:#9BAEA2; --line:#26372D;
  --brand:#38B98A; --on-brand:#04130C; --gold:#F0B73A; --hib:#E0678A; --ok:#4CC28D; --soft:#1B2C23; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 84px}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,7vw,4rem);font-weight:800}
h2{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{display:flex;align-items:center;gap:14px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,var(--gold) 0 30%,var(--brand) 31% 62%,var(--hib) 63%)}
.nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;margin-left:auto;align-items:center}
:root:lang(zh){--f-display:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;--f-body:system-ui,'PingFang SC','Microsoft YaHei',sans-serif}
.nav a{padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:500;color:var(--muted)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--soft)}
.nav a.btn{color:var(--on-brand)}
.langsel{width:auto;padding:7px 10px;font-weight:600}
.tabs{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer;text-decoration:none;background:var(--brand);color:var(--on-brand)}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.gold{background:var(--gold);color:#241a00}
.btn.sm{padding:8px 14px;font-size:.9rem}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px}
label.f{display:grid;gap:6px;font-weight:600;font-size:.92rem}
.in{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
textarea.in{min-height:110px;resize:vertical}
.hint{color:var(--muted);font-size:.88rem;font-weight:400}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding-block:48px 36px}
.hero p.lead{font-size:1.15rem;color:var(--muted);margin-block:18px 26px;max-width:46ch}
.hero .art{aspect-ratio:1;border-radius:24px;max-width:100%;background-size:96px;box-shadow:0 0 0 1px var(--line)}
.corr{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.corr span{font-size:.85rem;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:4px 12px}
section.s{padding-block:34px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;min-width:0}
.card:hover{border-color:var(--ink)}
.cov{aspect-ratio:16/9;position:relative;background-size:70px}
.tag{position:absolute;left:10px;top:10px;background:var(--surface);color:var(--ink);font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px}
.tag.ex{left:auto;right:10px;background:var(--gold);color:#241a00}
.cb{padding:16px;display:grid;gap:10px;min-width:0}
.cb p.by{color:var(--muted);font-size:.88rem}
.prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog b{display:block;height:100%;background:var(--gold);border-radius:99px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.meta strong{color:var(--ink);font-variant-numeric:tabular-nums}
.dt{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;padding-block:28px;align-items:start}
.dt>*{min-width:0}
.dt .cov{border-radius:18px;aspect-ratio:16/8}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px;position:sticky;top:calc(72px + env(safe-area-inset-top,0px))}
.big{font-family:var(--f-display);font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums}
.story{display:grid;gap:14px;margin-top:22px;max-width:65ch}
.rw{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;cursor:pointer;text-align:left;background:var(--bg)}
.rw[aria-pressed="true"]{border-color:var(--brand);background:var(--soft)}
.rw b{font-variant-numeric:tabular-nums}
.pay{display:grid;gap:8px}
.pay label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.pay label:has(input:checked){border-color:var(--brand);background:var(--soft)}
.mmbox{display:grid;gap:10px;border-left:3px solid var(--gold);padding-left:12px}
.sum{display:grid;gap:4px;font-size:.92rem;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between}
.demo{font-size:.82rem;background:var(--soft);border-radius:8px;padding:8px 10px;color:var(--muted)}
.fam{font-size:.9rem;border:1.5px dashed var(--gold);border-radius:10px;padding:8px 12px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:8px;align-content:start}
.step p{color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:.93rem;vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tr:last-child td{border-bottom:0}
.form{display:grid;gap:16px;max-width:680px;padding-block:28px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.trk div{border-top:4px solid var(--line);padding-top:6px;font-size:.8rem;color:var(--muted)}.trk div.on{border-color:var(--gold);color:var(--ink);font-weight:600}
.empty{padding:28px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}
.foot{border-top:1px solid var(--line);margin-top:40px;padding-block:28px;color:var(--muted);font-size:.88rem;display:grid;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:20;font-weight:600;max-width:90vw}
@media (max-width:820px){
  .hero,.dt{grid-template-columns:1fr}
  .hero .art{display:none}
  .panel{position:static}
  .nav{display:none}
  .langsel{margin-left:auto}
  .two,.seg{grid-template-columns:1fr}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs a{display:grid;justify-items:center;gap:2px;padding:6px 2px;text-decoration:none;font-size:.78rem;font-weight:600;color:var(--muted)}
  .tabs a[aria-current="page"]{color:var(--brand)}
  .tabs svg{width:22px;height:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function localize(p){
  const o=(p.i18n&&p.i18n[lang])||(SEED_TR[p.id]&&SEED_TR[p.id][lang])||(p.i18n&&lang!=='fr'?p.i18n.en:null);if(!o)return p;
  const q=Object.assign({},p,o);
  if(p.rewards)q.rewards=p.rewards.map((r,i)=>Object.assign({},r,(o.rewards||[])[i]));
  return q;
}
function allProjects(){
  const mine=store.get('sk_campaigns',[]).map(c=>{
    const d=Math.max(0,Math.ceil((c.end-Date.now())/864e5));return Object.assign({},c,{days:d,mine:true})});
  const pl=store.get('sk_pledges',[]);
  return mine.concat(SEED.map(x=>({...x}))).map(p=>{
    const mp=pl.filter(x=>x.pid===p.id);
    p.raised+=mp.reduce((s,x)=>s+x.amt,0);p.backers+=mp.length;return localize(p)});
}
function cover(p,size){
  const [a,b,c]=p.pal;let s;
  const m=p.motif%4;
  if(m===0)s=`<rect width='80' height='80' fill='${a}'/><circle cx='40' cy='40' r='32' fill='${b}'/><circle cx='40' cy='40' r='22' fill='${a}'/><circle cx='40' cy='40' r='11' fill='${c}'/>`;
  else if(m===1)s=`<rect width='80' height='80' fill='${a}'/><path d='M40 4L76 40 40 76 4 40z' fill='${b}'/><path d='M40 22L58 40 40 58 22 40z' fill='${a}'/><circle cx='40' cy='40' r='6' fill='${c}'/>`;
  else if(m===2)s=`<rect width='80' height='80' fill='${a}'/><path d='M0 40Q20 0 40 40T80 40' stroke='${b}' stroke-width='9' fill='none'/><path d='M0 66Q20 26 40 66T80 66' stroke='${c}' stroke-width='5' fill='none'/>`;
  else s=`<rect width='80' height='80' fill='${a}'/><path d='M0 0H40V40H0zM40 40H80V80H40z' fill='${b}'/><circle cx='60' cy='20' r='13' fill='${c}'/><circle cx='20' cy='60' r='13' fill='${c}'/>`;
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'>${s}</svg>`;
  return `background-color:${a};background-image:url("data:image/svg+xml,${encodeURIComponent(svg)}");background-size:${size||70}px`;
}
const pct=p=>Math.min(100,Math.round(p.raised/p.goal*100));
const catName=k=>t(k==='reward'?'cat_reward':'cat_solidaire');
function plk(n,b){
  if(lang==='ru'){const m=n%10,h=n%100;if(m===1&&h!==11)return b+'1';if(m>=2&&m<=4&&(h<12||h>14))return b+'F';return b+'N'}
  return b+(n===1?'1':'N');
}
function status(p){
  if(p.days>0)return t(plk(p.days,'days'),{n:p.days});
  return p.raised>=p.goal?t('reached'):t('ended');
}
const backersTxt=n=>t(plk(n,'backers'),{n});
function card(p){
  const isSeed=SEED.some(s=>s.id===p.id);
  return `<a class="card" href="#projet-${esc(p.id)}">
    <div class="cov" style="${cover(p)}"><span class="tag">${catName(p.type)}</span>${p.mine?`<span class="tag ex">${t('tag_mine')}</span>`:(isSeed?`<span class="tag ex">${t('tag_ex')}</span>`:'')}</div>
    <div class="cb"><h3>${esc(p.title)}</h3>
    <p class="by">${esc(p.by)} · ${esc(p.city)} (${esc(rname(p.res))}) → ${esc(cname(p.country))}</p>
    <div class="prog" role="img" aria-label="${t('pct_aria',{p:pct(p)})}"><b style="width:${pct(p)}%"></b></div>
    <div class="meta"><span><strong>${eur(p.raised)}</strong> ${t('of')} ${eur(p.goal)}</span><span>${pct(p)} %</span></div>
    <div class="meta"><span>${backersTxt(p.backers)}</span><span>${status(p)}</span></div></div></a>`;
}

  const rows=['tr1','tr2','tr3'].map(k=>`<tr>${t(k).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
  return `<section class="s"><div class="head"><h1 style="font-size:clamp(1.9rem,5vw,3rem)">${t('how_title')}</h1></div>
  <div class="steps">${[1,2,3,4].map(i=>`<div class="step"><h3>${t('hs'+i+'_t')}</h3><p>${t('hs'+i+'_d')}</p></div>`).join('')}</div></section>
  <section class="s"><div class="head"><h2>${t('fees_title')}</h2></div><div class="tbl"><table>
   <thead><tr><th>${t('th_type')}</th><th>${t('th_fee')}</th><th>${t('th_fail')}</th></tr></thead><tbody>${rows}</tbody></table></div>
   <p class="hint" style="margin-top:10px">${t('fees_note2')}</p></section>`;
}
function me(){const id=store.get('sk_session',null);return store.get('sk_users',[]).find(u=>u.id===id)||null}
async function sha(x){
  try{const b=new TextEncoder().encode('srk:'+x);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(v=>v.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of 'srk:'+x)h=((h<<5)+h+c.charCodeAt(0))|0;return 'f'+h}
}
let authMode='signup';
function vAuth(why){
  const su=authMode==='signup';
  return `<form class="form" id="auth" novalidate><div><h1 style="font-size:clamp(1.9rem,5vw,3rem)">${t(su?'acc_t_signup':'acc_t_login')}</h1><p class="hint" style="margin-top:8px">${t(why||'acc_why')}</p></div>
  ${su?`<label class="f"><span>${t('acc_name')}</span><input class="in" id="an" autocomplete="name"></label>`:''}
  <label class="f"><span>${t('acc_email')}</span><input class="in" id="ae" type="email" autocomplete="email" inputmode="email"></label>
  <label class="f"><span>${t('acc_pass')}</span><input class="in" id="ap" type="password" autocomplete="${su?'new-password':'current-password'}"></label>
  <p id="autherr" class="hint" style="color:var(--hib)" role="alert"></p>
  <button class="btn gold" type="submit">${t(su?'acc_signup':'acc_login')}</button>
  <p class="hint">${t(su?'acc_have':'acc_new')} <a href="#compte" data-act="goauth" data-v="${su?'login':'signup'}">${t(su?'acc_login':'acc_signup')}</a></p>
  <p class="demo">${t('acc_demo')}</p></form>`;
}
async function authSubmit(){
  const su=authMode==='signup',v=id=>($('#'+id)?String($('#'+id).value||''):'').trim(),err=k=>{const e=$('#autherr');if(e)e.textContent=t(k)};
  const name=v('an'),email=v('ae').toLowerCase(),pass=$('#ap')?String($('#ap').value||''):'';
  if(su&&!name)return err('err_name');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return err('err_email');
  if(su&&pass.length<8)return err('err_pass');
  const users=store.get('sk_users',[]),h=await sha(pass);let u;
  if(su){if(users.some(x=>x.email===email))return err('err_exists');u={id:'u'+Date.now().toString(36),name,email,hash:h,created:Date.now()};users.push(u);store.set('sk_users',users)}
  else{u=users.find(x=>x.email===email&&x.hash===h);if(!u)return err('err_login')}
  store.set('sk_session',u.id);
  const pl=store.get('sk_pledges',[]);pl.forEach(x=>{if(!x.uid)x.uid=u.id});store.set('sk_pledges',pl);
  toast(t(su?'t_created':'t_in'));
  if((location.hash||'')==='#compte')location.hash='#espace';else route(true);
}
function extras(p){
  const u=me();
  if(!u)return `<div class="demo" style="margin-top:22px;max-width:65ch;border:1.5px solid var(--gold)"><strong>${t('mem_t')}</strong><br>${t('mem_d')}<div class="row" style="margin-top:10px"><a class="btn sm" href="#compte" data-act="goauth" data-v="signup">${t('acc_signup')}</a><a class="btn sm alt" href="#compte" data-act="goauth" data-v="login">${t('acc_login')}</a></div></div>`;
  const rows=p.type==='reward'?[['b_prod',62],['b_deliv',14],['b_fee',5],['b_pay',4],['b_res',15]]:[['b_direct',93],['b_pay',3],['b_follow',4]];
  const ups=store.get('sk_updates',{})[p.id]||[];
  const own=p.mine&&p.owner===u.id;
  return `<section class="story" style="margin-top:26px"><h2>${t('bud_t')}</h2>
    ${rows.map(([k,n])=>`<div style="display:grid;gap:4px"><div class="meta"><span>${t(k)}</span><strong>${n} % · ${eur(p.goal*n/100)}</strong></div><div class="prog"><b style="width:${n}%"></b></div></div>`).join('')}
    <p class="hint">${t('bud_note')}</p></section>
  <section class="story" style="margin-top:26px"><h2>${t('upd_t')}</h2>
    ${ups.length?ups.map(x=>`<div class="step"><span class="hint">${new Date(x.date).toLocaleDateString(LOC[lang])}</span><p style="color:var(--ink)">${esc(x.text)}</p></div>`).join(''):`<p class="hint">${t('upd_none')}</p>`}
    ${own?`<form id="updform" style="display:grid;gap:10px"><textarea class="in" id="upd" placeholder="${t('upd_ph')}"></textarea><div><button class="btn sm" type="submit">${t('upd_post')}</button></div></form>`:''}</section>`;
}
function vSpace(){
  const u=me();if(!u)return vAuth();
  const all=allProjects(),pl=store.get('sk_pledges',[]).map((x,i)=>Object.assign({i},x)).filter(x=>x.uid===u.id);
  const cs=all.filter(p=>p.mine&&(p.owner===u.id||!p.owner));
  const steps=['st0','st1','st2','st3'];
  const trk=pl.filter(x=>x.ri>=0).map(x=>{
    const p=all.find(q=>q.id===x.pid),r=p&&p.rewards&&p.rewards[x.ri];if(!p||!r)return '';const sg=x.stage||0;
    return `<div class="step" style="gap:12px"><h3>${esc(r.name)}</h3><p class="hint">${esc(p.title)}</p>
      <div class="trk">${steps.map((k,j)=>`<div class="${j<=sg?'on':''}">${t(k)}</div>`).join('')}</div>
      ${sg<2?`<label class="f"><span>${t('addr_lbl')}</span><textarea class="in" id="addr-${x.i}" placeholder="${t('addr_ph')}">${esc(x.addr||'')}</textarea></label><button class="btn sm alt" type="button" data-act="saveaddr" data-i="${x.i}">${t('addr_save')}</button>`:(x.addr?`<p class="hint">${esc(x.addr)}</p>`:'')}
      ${sg<3?`<div><button class="chip" type="button" data-act="adv" data-i="${x.i}">${t('st_adv')}</button></div>`:''}</div>`}).join('');
  const rows=pl.map(x=>{const p=all.find(q=>q.id===x.pid);return `<tr><td>${new Date(x.date).toLocaleDateString(LOC[lang])}</td><td><a href="#projet-${esc(x.pid)}">${esc(p?p.title:x.pid)}</a></td><td>${eur2(x.amt)}</td><td>${esc(x.pm)}</td></tr>`}).join('');
  return `<section class="s"><div class="head"><div><h1 style="font-size:clamp(1.9rem,5vw,3rem)">${t('sp_title')}</h1><p class="hint" style="margin-top:6px">${t('hello',{n:esc(u.name)})} · ${esc(u.email)}</p></div><button class="btn sm alt" type="button" data-act="logout">${t('acc_logout')}</button></div>
  <h2 style="margin-bottom:14px">${t('trk_t')}</h2>
  ${trk?`<div class="steps">${trk}</div>`:`<div class="empty">${t('trk_none')}</div>`}
  <h2 style="margin:34px 0 14px">${t('my_c')}</h2>
  ${cs.length?`<div class="grid">${cs.map(card).join('')}</div>`:`<div class="empty">${t('no_c')} <a href="#lancer">${t('start')}</a></div>`}
  <h2 style="margin:34px 0 14px">${t('my_p')}</h2>
  ${pl.length?`<div class="tbl"><table><thead><tr><th>${t('th_date')}</th><th>${t('th_proj')}</th><th>${t('th_amt')}</th><th>${t('th_pay')}</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">${t('no_p')} <a href="#explorer">${t('discover')}</a></div>`}
  <p class="hint" style="margin-top:14px">${t('local')}</p></section>`;
}
const OP={fr:'Plateforme gérée par NémèsFund SRL, société de droit belge.',en:'Platform operated by NémèsFund SRL, a Belgian company.',nl:'Platform beheerd door NémèsFund SRL, een Belgische vennootschap.',de:'Plattform betrieben von der NémèsFund SRL, einer belgischen Gesellschaft.',es:'Plataforma gestionada por NémèsFund SRL, sociedad de derecho belga.',pt:'Plataforma gerida pela NémèsFund SRL, sociedade de direito belga.',it:'Piattaforma gestita da NémèsFund SRL, società di diritto belga.',ru:'Платформу управляет NémèsFund SRL, бельгийская компания.',zh:'本平台由比利时公司 NémèsFund SRL 运营。'};
function foot(){const L=(typeof lang!=='undefined'&&lang)||'fr';return `<footer class="foot"><strong>SarakaFund</strong><span>${OP[L]||OP.en}</span><span>${t('foot')}</span></footer>`}
/* ---------- routeur ---------- */
function chrome(key){
  const L=[['accueil','nav_home','tab_home'],['explorer','nav_explore','tab_explore'],['comment','nav_how'],['espace','nav_space','tab_space']];
  $('#nav').innerHTML=L.map(([r,n])=>`<a href="#${r}" data-r="${r}">${t(n)}</a>`).join('')+`<a class="btn sm" href="#lancer" style="margin-left:8px">${t('nav_launch')}</a>`;
  const ic={
   accueil:'<path d="M3 11l9-8 9 8v10H3z"/>',explorer:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
   lancer:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',espace:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>'};
  $('#tabs').innerHTML=[['accueil','tab_home'],['explorer','tab_explore'],['lancer','tab_launch'],['espace','tab_space']].map(([r,k])=>`<a href="#${r}" data-r="${r}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic[r]}</svg>${t(k)}</a>`).join('');
  $('#lang').value=lang;$('#lang').setAttribute('aria-label',t('aria_lang'));
  document.querySelectorAll('[data-r]').forEach(a=>a.getAttribute('data-r')===key?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
}
function route(keepScroll){
  const h=(location.hash||'#accueil').slice(1);let html,key;
  if(h.startsWith('projet-')){key='explorer';html=vProject(h.slice(7))}
  else if(h==='explorer'){key=h;html=vExplore()}
  else if(h==='lancer'){key=h;html=me()?vLaunch():vAuth('need_launch')}
  else if(h==='compte'){key='espace';html=vAuth()}
  else if(h==='comment'){key=h;html=vHow()}
  else if(h==='espace'){key=h;html=vSpace()}
  else{key='accueil';html=vHome()}
  document.documentElement.lang=lang;
  chrome(key);
  $('#app').innerHTML=html+foot();
  if(!keepScroll)window.scrollTo(0,0);
  if(h.startsWith('projet-'))updateSum();
  if(h==='lancer')fillPayout();
}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;e.setAttribute('role','status');document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function curProject(){return allProjects().find(x=>x.id===(location.hash||'').slice(8))}
function updateSum(){
  const s=$('#sum');if(!s)return;
  const a=Math.max(0,parseFloat($('#amt').value)||0),tp=$('#tip')?parseFloat($('#tip').value):0,tip=Math.round(a*tp)/100;
  const cc=(RES[defRes()]||RES.FR).ccy;
  s.innerHTML=`<div><span>${t('contribution')}</span><span>${eur2(a)}</span></div>${$('#tip')?`<div><span>${t('tip_line')}</span><span>${eur2(tip)}</span></div>`:''}<div style="font-weight:700"><span>${t('total')}</span><span>${eur2(a+tip)}</span></div>${cc!=='EUR'?`<div class="hint"><span>≈ ${esc(cc)}</span><span>${money((a+tip)*RATE[cc],cc)}</span></div>`:''}<p class="hint">${t('ccy_note')}</p>`;
}
function fillPayout(){
  const sel2=$('#po_op'),co=$('#co');if(!sel2||!co)return;
  sel2.innerHTML=ops(co.value).map(o=>`<option>${esc(o)}</option>`).join('');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;
  if(act==='ftype'){F.type=b.dataset.v;route(true)}
  else if(act==='fcountry'){F.country=b.dataset.v;route(true)}
  else if(act==='preset'){sel.amt=+b.dataset.v;sel.rw=-1;route(true)}
  else if(act==='rw'){const p=curProject(),r=p.rewards[+b.dataset.i];sel.rw=+b.dataset.i;sel.amt=r.amt;route(true)}
  else if(act==='goauth'){authMode=b.dataset.v;if(document.querySelector('#auth')){e.preventDefault();route(true)}}
  else if(act==='logout'){store.set('sk_session',null);route(true);toast(t('t_out'))}
  else if(act==='adv'){const pl=store.get('sk_pledges',[]),x=pl[+b.dataset.i];if(x){x.stage=Math.min(3,(x.stage||0)+1);store.set('sk_pledges',pl);route(true)}}
  else if(act==='saveaddr'){const pl=store.get('sk_pledges',[]),x=pl[+b.dataset.i],f=$('#addr-'+b.dataset.i);if(x&&f){x.addr=String(f.value||'').trim();store.set('sk_pledges',pl);toast(t('addr_ok'))}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){F.q=e.target.value;const pos=e.target.selectionStart;route(true);const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.id==='amt'||e.target.id==='tip'){updateSum()}
});
document.addEventListener('change',e=>{
  const n=e.target;
  if(n.id==='lang'){lang=n.value;store.set('sk_lang',lang);route(true);return}
  if(n.id==='res'){const a=parseFloat($('#amt').value);if(a>0)sel.amt=a;store.set('sk_res',n.value);route(true);return}
  if(n.name==='type'&&$('#modeRow'))$('#modeRow').hidden=n.value==='solidaire';
  if(n.name==='pm'&&$('#mmbox'))$('#mmbox').hidden=n.value!=='MM';
  if(n.name==='po'){$('#po_iban').hidden=n.value!=='iban';$('#po_mm').hidden=n.value!=='mm'}
  if(n.id==='co')fillPayout();
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='auth'){authSubmit();return}
  if(e.target.id==='updform'){const f=$('#upd'),txt=f?String(f.value||'').trim():'',pr=curProject(),us=me();if(!txt||!pr||!us)return;const all=store.get('sk_updates',{});(all[pr.id]=all[pr.id]||[]).unshift({date:Date.now(),text:txt,uid:us.id});store.set('sk_updates',all);route(true);toast(t('upd_ok'));return}
  if(e.target.id==='donate'){
    const p=curProject(),a=Math.round(parseFloat($('#amt').value)||0);
    if(a<1){toast(t('min_amt'));return}
    const ck=document.querySelector('input[name=pm]:checked');let pm=ck?ck.parentNode.textContent.trim():'';
    if(ck&&ck.value==='MM'){
      if(!phoneOk($('#mmnum').value)){toast(t('bad_phone'));return}
      pm=t('pm_mm')+' · '+$('#mmop').value;
    }
    const ri=(p.type==='reward'&&sel.rw>=0)?sel.rw:-1,u=me();
    const pl=store.get('sk_pledges',[]);pl.push({pid:p.id,amt:a,pm,date:Date.now(),uid:u?u.id:null,ri,stage:0,addr:''});store.set('sk_pledges',pl);
    sel={amt:25,rw:-1};route(true);toast(t(!u&&ri>=0?'thanks_acc':'thanks'));
  }
  if(e.target.id==='launch'){
    const v=id=>($('#'+id).value||'').trim(),type=document.querySelector('input[name=type]:checked').value;
    const g=parseInt(v('g'),10),po=document.querySelector('input[name=po]:checked').value;
    if(!v('t')||!v('s')||!v('by')||!v('city')||!(g>=100)||!v('st')){$('#err').textContent=t('err_fields');return}
    if(po==='iban'&&v('iban').replace(/\s/g,'').length<8){$('#err').textContent=t('err_iban');return}
    if(po==='mm'&&!phoneOk(v('po_num'))){$('#err').textContent=t('err_mm');return}
    const days=parseInt(v('d'),10),id='c'+Date.now().toString(36),
      pal=[['#0F4A38','#E9A820','#B8325A'],['#162B4A','#E9A820','#D9483B'],['#3B1F5C','#E9A820','#F0F0E8'],['#5B2A1A','#E9A820','#0F4A38']][Date.now()%4];
    const c={id,type,mode:type==='reward'?v('mode'):null,title:v('t'),summary:v('s'),by:v('by'),city:v('city'),res:v('lres'),owner:(me()||{}).id||null,country:v('co'),goal:g,raised:0,backers:0,end:Date.now()+days*864e5,pal,motif:Date.now()%4,story:v('st').split(/\n+/),
      payout:po==='mm'?'mobile money · '+v('po_op'):'IBAN',
      rewards:type==='reward'?[{amt:10,name:t('dr1_n'),desc:t('dr1_d')},{amt:40,name:t('dr2_n'),desc:t('dr2_d')}]:undefined,presets:type==='solidaire'?[10,25,50,100]:undefined};
    const cs=store.get('sk_campaigns',[]);cs.push(c);store.set('sk_campaigns',cs);
    location.hash='#projet-'+id;toast(t('published'));
  }
});
window.addEventListener('hashchange',()=>route());
route();
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}}catch(e){}
})();
</script>
